<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e1a">
  <title>Ampéria — RPG de physique électrique</title>
  <link rel="stylesheet" href="css/jeu.css">
</head>
<body>
  <div id="app">
    <header id="hud" aria-live="off"></header>
    <div id="milieu">
      <div id="scene">
        <canvas id="toile" width="320" height="180" aria-label="Carte du jeu"></canvas>
        <div id="objectif" aria-live="polite"></div>
        <div id="banniere" aria-live="polite"></div>
        <div id="toasts" aria-live="polite"></div>
      </div>
      <section id="panneau" aria-label="Combat"></section>
    </div>
    <div id="tactile" aria-hidden="true">
      <div class="croix"><span class="h">▲</span><span class="g">◀</span><span class="d">▶</span><span class="b">▼</span></div>
      <div class="boutons">
        <button data-action="codex" class="petit">📖</button>
        <button data-action="menu" class="petit">☰</button>
        <button data-action="B" class="rond b">B</button>
        <button data-action="A" class="rond a">A</button>
      </div>
    </div>
  </div>
  <div id="dialogue" hidden aria-live="polite"></div>
  <div id="fenetre" hidden></div>
  <div id="chargement"><h1>Ampéria</h1><p>Chargement…</p></div>

  <!-- Moteur : l'ordre compte. Les contenus viennent de data/ (aucune question n'est écrite dans le code). -->
  <script src="js/noyau.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/monde-donnees.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/entree.js"></script>
  <script src="js/sauvegarde.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/codex.js"></script>
  <script src="js/monde.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/jeu.js"></script>
</body>
</html>
